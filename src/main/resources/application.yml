spring:
  application:
    name: car-parking-lot

  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: admin

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
      ddl-auto: none
      show-sql: true

infra:
  scheduler:
    check-availability-cron: '0 0/1 * * * *'
  hdb:
    carpark-availability: https://api.data.gov.sg/v1/transport/carpark-availability
  onemap:
    url: https://www.onemap.gov.sg/api/common/convert/3414to4326
